<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="180" height="180" rx="36" fill="#0D3B6E"/>
  <!-- Crest circle -->
  <circle cx="90" cy="76" r="48" fill="none" stroke="#F59E0B" stroke-width="4"/>
  <!-- Book / torch icon (stylised cap and book) -->
  <!-- Graduation cap top -->
  <polygon points="90,36 54,54 90,66 126,54" fill="#F59E0B"/>
  <!-- Cap hanging cord / tassel -->
  <rect x="88" y="66" width="4" height="18" fill="#F59E0B"/>
  <circle cx="90" cy="86" r="4" fill="#F59E0B"/>
  <!-- GSS text -->
  <text x="90" y="112" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="white" letter-spacing="1">GSS</text>
  <!-- HONG text -->
  <text x="90" y="132" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#F59E0B" letter-spacing="3">HONG</text>
  <!-- Bottom tagline bar -->
  <rect x="20" y="148" width="140" height="18" rx="9" fill="#F59E0B" opacity="0.15"/>
  <text x="90" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#F59E0B" letter-spacing="1.5">EST. 1967</text>
