<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D3B6E"/>
      <stop offset="100%" stop-color="#0a2e55"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="white" fill-opacity="0.03"/>
  <circle cx="1100" cy="500" r="250" fill="white" fill-opacity="0.02"/>
  <circle cx="100" cy="530" r="140" fill="white" fill-opacity="0.02"/>

  <!-- Left accent stripe -->
  <rect x="80" y="160" width="6" height="300" rx="3" fill="#F59E0B"/>

  <!-- Crest area -->
  <circle cx="160" cy="200" r="64" fill="none" stroke="#F59E0B" stroke-width="3" stroke-opacity="0.5"/>
  <circle cx="160" cy="200" r="54" fill="#F59E0B" fill-opacity="0.08"/>
  <!-- Graduation cap in crest -->
  <polygon points="160,165 128,180 160,191 192,180" fill="#F59E0B"/>
  <rect x="158" y="191" width="4" height="16" fill="#F59E0B"/>
  <circle cx="160" cy="209" r="5" fill="#F59E0B"/>
  <text x="160" y="236" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="white" letter-spacing="2">GSS</text>

  <!-- Main headline -->
  <text x="260" y="190" font-family="Arial Black, sans-serif" font-size="62" font-weight="900" fill="white" letter-spacing="-1">Government Secondary</text>
  <text x="260" y="265" font-family="Arial Black, sans-serif" font-size="62" font-weight="900" fill="white" letter-spacing="-1">School, Hong</text>

  <!-- Accent line under headline -->
  <rect x="260" y="285" width="580" height="4" rx="2" fill="url(#accent-line)"/>

  <!-- Tagline -->
  <text x="260" y="340" font-family="Arial, sans-serif" font-size="28" fill="white" fill-opacity="0.65" letter-spacing="0.5">Adamawa State, Nigeria · Est. 1967</text>

  <!-- Feature pills -->
  <rect x="260" y="390" width="200" height="48" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="360" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">📚 Academics</text>

  <rect x="476" y="390" width="220" height="48" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="586" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">📋 Student Portal</text>

  <rect x="712" y="390" width="180" height="48" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="802" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">🏆 94% WAEC</text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="black" fill-opacity="0.25"/>
  <text x="80" y="608" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.5">gsshong.edu.ng</text>
  <text x="1120" y="608" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#F59E0B" fill-opacity="0.85">Excellence in Education</text>
</svg>
